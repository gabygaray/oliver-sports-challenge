services:
  postgres:
    image: postgres:16-alpine
    container_name: oliver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-oliver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oliver}
      POSTGRES_DB: ${DB_NAME:-oliver}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-oliver}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
